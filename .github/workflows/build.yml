name: Build StandChills Menu
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true
      - name: Build
        run: |
          set -e
          cd zene/Jni
          ndk-build -j$(nproc) NDK_PROJECT_PATH=. NDK_APPLICATION_MK=Application.mk
          find .. -type f \( -name "libfreecamk.so" -o -name "inj" \) -ls
      - uses: actions/upload-artifact@v4
        with:
          name: standchills-arm64
          path: |
            zene/Jni/libs/arm64-v8a/**
            zene/libs/arm64-v8a/**
